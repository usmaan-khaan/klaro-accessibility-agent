repos:
  - repo: https://github.com/semgrep/semgrep
    rev: v1.75.0
    hooks:
      - id: semgrep
        name: Semgrep Scan for Google API Credentials
        entry: semgrep scan --config .semgrep/rules.yaml --error
        language: system
        types: [text]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: unit-tests
        name: Run unit tests (workflow graph + retry-cap + logic guards)
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
