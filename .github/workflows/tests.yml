name: Safety regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: klaro-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m pytest tests/unit tests/test_agent.py tests/browser -q
      - run: uv run python -m pre_commit run --all-files
